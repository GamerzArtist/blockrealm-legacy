name: Wildlight clean install release
on:
  push:
    branches: ['release/wildlight-install-fix']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK and configure isolated preview signing
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          pass=$(openssl rand -hex 24)
          echo "::add-mask::$pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/wildlight-preview.p12" -storetype PKCS12 -storepass "$pass" -keypass "$pass" -alias preview -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VoxelForge Wildlight Preview"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=preview\nkeyPassword=%s\n' "$RUNNER_TEMP/wildlight-preview.p12" "$pass" "$pass" > v2/android/signing.properties
      - name: Test and assemble release
        working-directory: v2/android
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Check signing and APK metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp v2/android/app/build/outputs/apk/release/app-release.apk dist/VoxelForge-Wildlight-0.3.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/VoxelForge-Wildlight-0.3.1.apk | tee dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/VoxelForge-Wildlight-0.3.1.apk | tee dist/badging.txt
          grep -F "name='com.voxelforge.wildlight.preview'" dist/badging.txt
          ! grep -E 'application-debuggable|testOnly' dist/badging.txt
          (cd dist && sha256sum VoxelForge-Wildlight-0.3.1.apk > SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clean install and native graphics smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/wildlight-install-smoke.sh
      - name: Publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create wildlight-native-preview-0.3.1 dist/VoxelForge-Wildlight-0.3.1.apk dist/SHA256SUMS.txt dist/signature.txt --target "$GITHUB_SHA" --prerelease --title "Wildlight 0.3.1 — clean-install preview" --notes "Native release-signed Creative preview with isolated application ID, verified on an Android 35 emulator without adb -t. Existing app data is not overwritten. Experimental, not a full survival port. Signing key generated for this isolated preview; future updates require a stable signing key. Physical-device verification remains outstanding."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wildlight-install-check
          path: dist/
          if-no-files-found: ignore
